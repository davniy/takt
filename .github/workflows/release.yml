name: Release

on:
  push:
    tags:
      - "v*"
  # Manual/Auto Release dispatch: GITHUB_TOKEN pushes cannot retrigger
  # push-based workflows, so auto-release.yml hands the computed tag over
  # through this input instead of relying on the tag push itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z-alpha); must already point at the target commit"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Release gate (scripts/verify.sh)
    # scripts/verify.sh is the maintainer's local (macOS) gate: parts of
    # tests/e2e production-flow and tooling/evaluation suites are not yet
    # Linux-clean, so the release gate runs where it is supported.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.7.2

      - name: Configure Git identity
        run: |
          git config --global user.name "Takt CI"
          git config --global user.email "takt-ci@example.invalid"

      # scripts/verify.sh stages run as separate steps with tee'd logs so the
      # failing stage is visible in the job view and full output survives as
      # an artifact when the blob log endpoint is unreachable.
      - name: Gate: fmt
        run: gofmt -w cmd internal sdk reference tests

      - name: Gate: vet
        run: go vet ./...

      - name: Gate: test-all
        run: make GO_TEST_P=8 test-all 2>&1 | tee gate-test-all.log

      - name: Gate: journeys
        run: make journeys 2>&1 | tee gate-journeys.log

      - name: Gate: race-all
        run: make GO_TEST_P=8 race-all 2>&1 | tee gate-race-all.log

      - name: Gate: build and smoke
        env:
          TAKT_REQUIRE_TYPESCRIPT: "1"
        run: |
          {
            go build -o bin/takt ./cmd/takt
            ./scripts/test-host-integrations-typescript.sh
          } 2>&1 | tee gate-smoke.log

      - name: Gate: validate examples
        run: |
          ./bin/takt validate examples/route-dsl/workflow.yaml \
            --config examples/route-dsl/config.yaml \
            --workspace examples/route-dsl \
            --json >/dev/null
          ./bin/takt validate examples/hook-retry/workflow.yaml \
            --config examples/hook-retry/config.yaml \
            --workspace examples/hook-retry \
            --json >/dev/null
          ./bin/takt validate examples/pi-smoke/workflow.yaml \
            --config examples/pi-smoke/config.yaml \
            --workspace . \
            --json >/dev/null
          ./bin/takt validate examples/opencode-smoke/workflow.yaml \
            --config examples/opencode-smoke/config.yaml \
            --workspace . \
            --json >/dev/null
          ./bin/takt validate examples/route-dsl-e2e/workflow.yaml \
            --config examples/route-dsl-e2e/config.yaml \
            --workspace examples/route-dsl-e2e \
            --json >/dev/null
          ./bin/takt validate examples/composition/workflow.yaml \
            --config examples/composition/config.yaml \
            --workspace examples/composition \
            --json >/dev/null
          ./bin/takt validate examples/external-executor/workflow.yaml \
            --config examples/external-executor/config.yaml \
            --workspace . \
            --json >/dev/null
          ./bin/takt validate examples/authoring-daemon/workflow.yaml \
            --config examples/authoring-daemon/config.yaml \
            --workspace examples/authoring-daemon \
            --warnings-as-errors \
            --json >/dev/null
          echo 'verification: PASS'

      - name: Upload gate logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-logs-${{ github.run_attempt }}
          path: gate-*.log
          retention-days: 7

  build-and-release:
    name: Build & Publish Release
    needs: verify
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          # internal/version.Value is a var: dev builds report the VERSION
          # file, release binaries report the tag exactly.
          VERSION="${RELEASE_TAG#v}"
          targets=(
            "linux/amd64/takt-linux-amd64"
            "darwin/arm64/takt-darwin-arm64"
            "darwin/amd64/takt-darwin-amd64"
          )

          for target in "${targets[@]}"; do
            IFS='/' read -r goos goarch binary <<< "$target"
            echo "==> Building ${binary} for ${goos}/${goarch}..."
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="-s -w -X takt/internal/version.Value=${VERSION}" \
              -o "dist/${binary}" \
              ./cmd/takt
          done

      - name: Package archives and checksums
        run: |
          set -euo pipefail
          cd dist
          tar -czvf "takt-${RELEASE_TAG}-linux-amd64.tar.gz" takt-linux-amd64
          tar -czvf "takt-${RELEASE_TAG}-darwin-arm64.tar.gz" takt-darwin-arm64
          tar -czvf "takt-${RELEASE_TAG}-darwin-amd64.tar.gz" takt-darwin-amd64

          sha256sum takt-* > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: takt-${{ env.RELEASE_TAG }}
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --title "${RELEASE_TAG}" \
            --generate-notes
